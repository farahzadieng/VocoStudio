<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ title }} — VOCO Voice Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="صفحه اصلی استودیوی صدای شفاف">
      <span class="brand-mark" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
      <span><strong>VOCO</strong><small>استودیوی صدای شفاف</small></span>
    </a>
    <div class="local-badge"><span></span> اجرا روی دستگاه شما</div>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>پردازش کاملاً محلی</span>
    <span class="footer-dot">•</span>
    <span>فایل‌ها از دستگاه شما خارج نمی‌شوند</span>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
